<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f36">
  <link rel="icon" href="data:,">
  <meta name="description" content="Spain Trip 2026–27 travel companion">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <title>Spain Trip 2026–27</title>
  <link rel="stylesheet" href="assets/ux-v1.css">
</head>
<body>
  <a class="skip-link" href="#app-main">本文へ移動</a>
  <header class="site-header">
    <div class="header-inner">
      <button class="brand" type="button" data-tab-target="home" aria-label="ホームへ">
        <span class="brand-mark">S</span>
        <span><strong>Spain Trip</strong><small>2026–27 · 大人3名</small></span>
      </button>
      <nav class="desktop-nav" aria-label="主要ナビゲーション" data-primary-nav></nav>
      <div class="global-actions">
        <div class="dual-clock" data-local-clock aria-label="日本とスペインの現在時刻">
          <div class="clock-zone" data-clock-card="japan"><span>日本</span><small data-clock-date="Asia/Tokyo">--/--</small><strong data-clock-time="Asia/Tokyo">--:--</strong></div>
          <div class="clock-zone" data-clock-card="spain"><span>スペイン</span><small data-clock-date="Europe/Madrid">--/--</small><strong data-clock-time="Europe/Madrid">--:--</strong></div>
        </div>
        <button class="icon-action" type="button" data-open="search"><span aria-hidden="true">⌕</span><span class="action-label">検索</span></button>
        <button class="icon-action sos" type="button" data-open="sos"><span aria-hidden="true">＋</span><span class="action-label">SOS</span></button>
      </div>
    </div>
  </header>

  <main id="app-main" class="app-main" tabindex="-1">
    <section class="day-context" aria-label="確認する日">
      <div class="day-context-copy">
        <span class="eyebrow">ALL 12 DAYS</span>
        <strong>日を選ぶ</strong>
      </div>
      <div class="day-switcher" role="tablist" aria-label="旅行日" data-day-switcher></div>
    </section>

    <div id="screen" class="screen" aria-live="polite"></div>
  </main>

  <nav class="mobile-nav" aria-label="主要ナビゲーション" data-mobile-nav></nav>

  <div class="scrim" data-scrim hidden></div>
  <section class="sheet" data-sheet aria-modal="true" role="dialog" aria-labelledby="sheet-title" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-header">
      <div><span class="eyebrow" data-sheet-eyebrow>DETAIL</span><h2 id="sheet-title" data-sheet-title>詳細</h2></div>
      <button class="close-button" type="button" data-close-sheet aria-label="閉じる">×</button>
    </header>
    <div class="sheet-body" data-sheet-body></div>
  </section>

  <div class="toast" data-toast role="status" hidden></div>
  <script src="assets/phase1-canonical.js"></script>
  <script src="assets/ux-v1-final-plan.js"></script>
  <script src="assets/ux-v1-full-data.js"></script>
  <script src="assets/ux-v1.js"></script>
</body>
</html>
